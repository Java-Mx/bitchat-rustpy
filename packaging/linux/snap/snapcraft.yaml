name: bitchat
base: core24
version: '0.3.3'
summary: Encrypted peer-to-peer BLE and LAN mesh chat built with Python and Rust
description: |
  BitChat RustPy is a decentralized peer-to-peer terminal chat client operating
  over Bluetooth Low Energy (BLE) and Local Area Networks (LAN) with end-to-end
  encryption using the Noise Protocol (X25519 / ChaCha20-Poly1305) and an
  interactive terminal user interface built with Python and a native Rust core.

grade: stable
confinement: strict

apps:
  bitchat:
    command: bin/bitchat
    plugs:
      - network
      - network-bind
      - bluez
    environment:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

parts:
  bitchat:
    plugin: python
    source: .
    build-packages:
      - gcc
      - libdbus-1-dev
      - pkg-config
    stage-packages:
      - libdbus-1-3
