name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Distributables (.deb & AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev dpkg-dev flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 || true

      - name: Install dependencies (uv sync --all-groups)
        run: uv sync --all-groups

      - name: Run Quality Checks (ruff check & format)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Type Checking (pyright)
        run: uv run pyright

      - name: Run Test Suite (pytest)
        run: uv run pytest

      - name: Build Python Packages (Wheel & sdist)
        run: uv build

      - name: Build Linux Distributables (.deb, AppImage & Flatpak)
        run: uv run python packaging/linux/build.py --build-flatpak

      - name: Upload Linux Distributables
        uses: actions/upload-artifact@v7
        with:
          name: linux-distributables
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/*.deb.sha256
            dist/*-x86_64.AppImage
            dist/*-x86_64.AppImage.sha256
            dist/*.flatpak
            dist/*.flatpak.sha256

  build-windows:
    name: Build Windows Distributables (.exe & WinGet)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies (uv sync --all-groups)
        run: uv sync --all-groups

      - name: Build Windows Python Wheel
        run: uv build --wheel

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            Write-Host "ISCC is already on PATH."
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            choco install innosetup --no-progress
            "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Run Windows Packaging Unit Tests
        shell: pwsh
        run: uv run pytest tests/unit/test_packaging_windows.py tests/unit/test_package.py tests/unit/test_native_core.py tests/unit/test_uninstaller.py

      - name: Build, Sign (if credentials configured), Verify & Generate Manifests
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_SIGNING_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_THUMBPRINT }}
          WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: uv run python packaging/windows/build.py

      - name: Verify Signature, Checksum & End-to-End Installer Lifecycle
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: |
          $version = (Get-Content pyproject.toml | Select-String '^version = "(.*)"').Matches.Groups[1].Value
          $installer = Get-Item "dist/BitChat-$version-windows-x64.exe"
          $shaFile = "dist/BitChat-$version-windows-x64.exe.sha256"
          $sig = Get-AuthenticodeSignature -LiteralPath $installer.FullName

          if (($env:WINDOWS_SIGNING_CERT -ne '') -or ($env:WINDOWS_SIGNING_REQUIRED -eq 'true')) {
            if ($sig.Status -ne 'Valid') {
              throw "Authenticode signature verification failed! Status: $($sig.Status) ($($sig.StatusMessage))"
            }
            if (-not $sig.TimeStamperCertificate) {
              throw "Signed installer is missing a valid RFC3161 timestamp!"
            }
          }

          $actualHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          $recordedHash = (Get-Content $shaFile).Split(' ')[0].Trim()
          if ($actualHash -ne $recordedHash) {
            throw "SHA-256 mismatch: $actualHash vs $recordedHash"
          }

          # Smoke-test unattended user-scope installation and uninstallation
          $testInstallDir = Join-Path $env:RUNNER_TEMP "BitChat-SmokeTest"
          $testStartupDir = Join-Path $env:RUNNER_TEMP "BitChat-StartupTest"
          $env:BITCHAT_STARTUP_DIR = $testStartupDir
          Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$testInstallDir`" /TASKS=`"!desktopicon,!startmenuicon,!envPath,!launchapp,startupicon`"" -Wait -NoNewWindow
          $installedExe = Join-Path $testInstallDir "bitchat.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed binary not found at $installedExe" }
          & $installedExe --version
          & $installedExe --help
          & $installedExe --startup status
          & $installedExe --uninstall --dry-run
          $uninstaller = Join-Path $testInstallDir "unins000.exe"
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -NoNewWindow
          }

          # Write GitHub Actions Step Summary
          $sigSummary = if ($sig.Status -eq 'Valid') { "Signed & Verified ($($sig.SignerCertificate.Subject))" } else { "Unsigned ($($sig.Status)) — Cannot be presented as Verified Publisher" }
          @(
            "### BitChat Windows Release Summary (v$version)"
            ""
            "| Property | Value |"
            "|---|---|"
            "| **Installer** | ``$($installer.Name)`` |"
            "| **File Size** | $($installer.Length) bytes |"
            "| **SHA-256** | ``$actualHash`` |"
            "| **Authenticode Status** | $sigSummary |"
            "| **Timestamp** | $(if ($sig.TimeStamperCertificate) { $sig.TimeStamperCertificate.Subject } else { 'None' }) |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Windows Distributables
        uses: actions/upload-artifact@v7
        with:
          name: windows-distributables
          path: |
            dist/*.whl
            dist/BitChat-*-windows-x64.exe
            dist/BitChat-*-windows-x64.exe.sha256
            dist/BitChat-*-windows-x64.metadata.json
            packaging/windows/winget/Java-Mx.BitChat.yaml
            manifests/

  build-macos:
    name: Build macOS ABI3 Wheel (Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies (uv sync --all-groups)
        run: uv sync --all-groups

      - name: Verify macOS CLI Version & Native Core Tests
        run: |
          uv run bitchat --version
          uv run pytest tests/unit/test_native_core.py tests/interoperability/test_tui_interop.py tests/unit/test_package.py

      - name: Build macOS ABI3 Wheel
        run: uv build --wheel

      - name: Upload macOS Distributables
        uses: actions/upload-artifact@v7
        with:
          name: macos-distributables
          path: |
            dist/*.whl

  publish:
    name: Publish GitHub Release & WinGet
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux Distributables
        uses: actions/download-artifact@v8
        with:
          name: linux-distributables
          path: dist/

      - name: Download Windows Distributables
        uses: actions/download-artifact@v8
        with:
          name: windows-distributables
          path: dist-win/

      - name: Download macOS Distributables
        uses: actions/download-artifact@v8
        with:
          name: macos-distributables
          path: dist-mac/

      - name: Organize & Verify Artifacts
        run: |
          mkdir -p packaging/windows/winget/
          cp -r dist-win/BitChat* dist/ 2>/dev/null || true
          cp -r dist-win/dist/BitChat* dist/ 2>/dev/null || true
          cp -r dist-win/*.whl dist/ 2>/dev/null || true
          cp -r dist-win/dist/*.whl dist/ 2>/dev/null || true
          cp -r dist-mac/*.whl dist/ 2>/dev/null || true
          cp -r dist-mac/dist/*.whl dist/ 2>/dev/null || true
          for f in dist/*.whl dist/*.tar.gz; do
            if [ -f "$f" ]; then
              sha=$(sha256sum "$f" | awk '{print toupper($1)}')
              base=$(basename "$f")
              echo "$sha *$base" > "$f.sha256"
            fi
          done
          if [ -f dist-win/packaging/windows/winget/Java-Mx.BitChat.yaml ]; then
            cp dist-win/packaging/windows/winget/Java-Mx.BitChat.yaml packaging/windows/winget/
          elif [ -f dist-win/Java-Mx.BitChat.yaml ]; then
            cp dist-win/Java-Mx.BitChat.yaml packaging/windows/winget/
          fi
          ls -la dist/
          echo "Verifying mandatory release artifacts exist..."
          ls dist/BitChat-*-windows-x64.exe || { echo "ERROR: Missing Windows .exe!"; exit 1; }
          ls dist/BitChat-*-windows-x64.exe.sha256 || { echo "ERROR: Missing Windows checksum!"; exit 1; }
          ls dist/*.deb || { echo "ERROR: Missing Debian .deb!"; exit 1; }
          ls dist/*.deb.sha256 || { echo "ERROR: Missing Debian checksum!"; exit 1; }
          ls dist/*.whl || { echo "ERROR: Missing Python wheel!"; exit 1; }
          ls dist/*.tar.gz || { echo "ERROR: Missing Python sdist!"; exit 1; }

      - name: Create GitHub Release & Upload All Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.whl.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/BitChat-*-windows-x64.exe
            dist/BitChat-*-windows-x64.exe.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*-x86_64.AppImage
            dist/*-x86_64.AppImage.sha256
            dist/*.flatpak
            dist/*.flatpak.sha256
            packaging/windows/winget/Java-Mx.BitChat.yaml

      - name: Verify WinGet Manifest Consistency & Check Upstream Duplicate
        id: winget_check
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          MANIFEST="packaging/windows/winget/Java-Mx.BitChat.yaml"
          INSTALLER="dist/BitChat-${VERSION}-windows-x64.exe"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Missing WinGet manifest: $MANIFEST"
            exit 1
          fi

          MANIFEST_ID=$(grep -E '^PackageIdentifier:' "$MANIFEST" | awk '{print $2}' | tr -d '\r')
          MANIFEST_VER=$(grep -E '^PackageVersion:' "$MANIFEST" | awk '{print $2}' | tr -d '\r')
          MANIFEST_SHA=$(grep -E 'InstallerSha256:' "$MANIFEST" | awk '{print $2}' | tr -d '\r' | tr '[:lower:]' '[:upper:]')
          ACTUAL_SHA=$(sha256sum "$INSTALLER" | awk '{print toupper($1)}')

          if [ "$MANIFEST_ID" != "Java-Mx.BitChat" ]; then
            echo "::error::Unexpected PackageIdentifier '$MANIFEST_ID' (expected Java-Mx.BitChat)"
            exit 1
          fi
          if [ "$MANIFEST_VER" != "$VERSION" ]; then
            echo "::error::WinGet manifest PackageVersion '$MANIFEST_VER' does not match release tag '$VERSION'"
            exit 1
          fi
          if [ "$MANIFEST_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::WinGet manifest InstallerSha256 '$MANIFEST_SHA' does not match installer '$ACTUAL_SHA'"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

          # Check whether this exact version is already published in microsoft/winget-pkgs
          UPSTREAM_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/j/Java-Mx/BitChat/${VERSION}")
          if [ "$UPSTREAM_CODE" = "200" ]; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Java-Mx.BitChat ${VERSION} is already published in microsoft/winget-pkgs; skipping duplicate submission."
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Warn if WINGET_TOKEN Secret Is Not Configured
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && steps.winget_check.outputs.already_exists != 'true' && env.WINGET_TOKEN == ''
        run: |
          VERSION="${{ steps.winget_check.outputs.version }}"
          echo "::warning title=WinGet Publication Skipped (Missing WINGET_TOKEN)::GitHub Release v${VERSION} succeeded, but automated submission to microsoft/winget-pkgs was skipped because secrets.WINGET_TOKEN is not configured. Submit manifests/j/Java-Mx/BitChat/${VERSION}/ manually or configure WINGET_TOKEN."
          {
            echo "### WinGet Publication Status (v${VERSION})"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| **PackageIdentifier** | \`Java-Mx.BitChat\` |"
            echo "| **Manifest Version & SHA-256** | Verified (\`${{ steps.winget_check.outputs.sha256 }}\`) |"
            echo "| **Upstream Submission** | **SKIPPED — \`secrets.WINGET_TOKEN\` not configured** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit to Microsoft winget-pkgs
        id: winget_submit
        continue-on-error: true
        uses: vedantmgoyal2009/winget-releaser@v2
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && steps.winget_check.outputs.already_exists != 'true' && env.WINGET_TOKEN != ''
        with:
          identifier: Java-Mx.BitChat
          installers-regex: 'BitChat-.*-windows-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Report WinGet Submission Outcome
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && steps.winget_check.outputs.already_exists != 'true' && env.WINGET_TOKEN != ''
        run: |
          VERSION="${{ steps.winget_check.outputs.version }}"
          PR_URL=$(curl -s "https://api.github.com/search/issues?q=repo:microsoft/winget-pkgs+is:pr+in:title+Java-Mx.BitChat+${VERSION}" | python3 -c "import json,sys; items=json.load(sys.stdin).get('items',[]); print(items[0]['html_url'] if items else 'Not found')" || echo "Lookup unavailable")
          OUTCOME="${{ steps.winget_submit.outcome }}"
          {
            echo "### WinGet Publication Status (v${VERSION})"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| **PackageIdentifier** | \`Java-Mx.BitChat\` |"
            echo "| **Manifest Version & SHA-256** | Verified (\`${{ steps.winget_check.outputs.sha256 }}\`) |"
            echo "| **Submission Step Outcome** | \`${OUTCOME}\` |"
            echo "| **Upstream PR URL** | ${PR_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != "success" ]; then
            echo "::error title=WinGet Submission Failed::Automated submission to microsoft/winget-pkgs failed (outcome=${OUTCOME}). Check step logs and PR status (${PR_URL})."
            exit 1
          fi
